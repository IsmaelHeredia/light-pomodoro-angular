@if (aboutService.isOpen()) {
  <div
    data-testid="about-modal-backdrop"
    (click)="onBackdropClick($event)"
    class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4"
  >
    <div data-testid="about-modal" class="bg-gv-bg rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">

      <div class="bg-gv-primary-dark px-6 py-8 text-center relative">
        <button
          data-testid="about-close-btn"
          (click)="aboutService.close()"
          class="absolute top-3 right-3 text-gv-bg/70 hover:text-gv-bg text-xl leading-none transition-colors"
          aria-label="Cerrar"
        >
          ✕
        </button>

        <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gv-bg/15 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-gv-bg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 3" />
          </svg>
        </div>

        <h2 data-testid="about-app-name" class="text-gv-bg font-bold text-lg tracking-wide">{{ appName }}</h2>
        <span data-testid="about-version" class="inline-block mt-1 text-xs font-semibold text-gv-bg/80 bg-gv-bg/15 px-2.5 py-0.5 rounded-full">
          v{{ version }}
        </span>
      </div>

      <div class="px-6 py-5 space-y-5">
        <p data-testid="about-description" class="text-gv-fg/80 text-sm leading-relaxed text-center">
          {{ description }}
        </p>

        <div class="border-t border-gv-fg/10 pt-4 flex items-center justify-between">
          <span class="text-gv-fg/50 text-xs font-semibold uppercase tracking-wide">Autor</span>
          <span data-testid="about-author" class="text-gv-fg text-sm font-semibold">{{ author }}</span>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-gv-fg/10 bg-gv-surface/40">
        <button
          data-testid="about-footer-close-btn"
          (click)="aboutService.close()"
          class="w-full px-4 py-2.5 rounded-lg bg-gv-primary-dark text-gv-bg font-semibold text-sm hover:opacity-90 transition-opacity"
        >
          Cerrar
        </button>
      </div>
    </div>
  </div>
}
