<div
  cdkDrag
  [cdkDragData]="task()"
  [attr.data-testid]="'task-item-' + task().id"
  class="flex items-center gap-3 bg-gv-surface rounded-lg px-3 py-2.5 group transition-colors duration-500"
>
  <span
    cdkDragHandle
    data-testid="task-drag-handle"
    class="cursor-grab active:cursor-grabbing text-gv-fg/40 hover:text-gv-fg/70 select-none"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="8" cy="6" r="1.5" /><circle cx="16" cy="6" r="1.5" />
      <circle cx="8" cy="12" r="1.5" /><circle cx="16" cy="12" r="1.5" />
      <circle cx="8" cy="18" r="1.5" /><circle cx="16" cy="18" r="1.5" />
    </svg>
  </span>

  <button
    data-testid="task-toggle-btn"
    (click)="toggle()"
    class="w-5 h-5 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors"
    [class.border-gv-primary-dark]="!task().completed"
    [class.bg-gv-primary-dark]="task().completed"
    [class.border-transparent]="task().completed"
  >
    @if (task().completed) {
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-gv-bg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    }
  </button>

  @if (isEditing()) {
    <input
      data-testid="task-edit-input"
      type="text"
      [(ngModel)]="editValue"
      (keydown.enter)="confirmEdit()"
      (keydown.escape)="cancelEdit()"
      (blur)="confirmEdit()"
      autofocus
      class="flex-1 bg-transparent border-b border-gv-primary-dark outline-none text-gv-fg py-0.5"
    />
  } @else {
    <span
      data-testid="task-name"
      (dblclick)="startEdit()"
      class="flex-1 text-gv-fg cursor-text truncate"
      [class.line-through]="task().completed"
      [class.opacity-50]="task().completed"
    >
      {{ task().name }}
    </span>
  }

  <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
    <button
      data-testid="task-edit-btn"
      (click)="startEdit()"
      class="text-gv-fg/50 hover:text-gv-fg p-1"
      aria-label="Editar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
    </button>
    <button
      data-testid="task-delete-btn"
      (click)="remove()"
      class="text-gv-fg/50 hover:text-red-700 p-1"
      aria-label="Borrar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </button>
  </div>
</div>
