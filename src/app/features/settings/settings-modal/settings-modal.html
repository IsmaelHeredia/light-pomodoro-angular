@if (settingsService.isOpen()) {
<div data-testid="settings-modal-backdrop" (click)="onBackdropClick($event)"
  class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div data-testid="settings-modal"
    class="bg-gv-bg rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">

    <div class="flex items-center justify-between px-6 py-4 border-b border-gv-fg/10">
      <h2 class="text-gv-fg font-bold tracking-widest text-sm uppercase">Configuración</h2>
      <button data-testid="settings-close-btn" (click)="onCancel()"
        class="text-gv-fg/50 hover:text-gv-fg text-xl leading-none" aria-label="Cerrar">
        ✕
      </button>
    </div>

    <div class="px-6 py-5 space-y-6">

      <div>
        <p class="text-gv-fg/60 text-xs font-bold uppercase tracking-wide mb-3">Tiempo (minutos)</p>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-gv-fg text-xs font-semibold block mb-1">Pomodoro</label>
            <input data-testid="settings-pomodoro-input" type="number" step="1" min="1" [ngModel]="draft().pomodoro"
              (ngModelChange)="onNumberChange('pomodoro', $event)"
              class="w-full bg-gv-surface rounded-lg px-3 py-2 text-gv-fg outline-none focus:ring-2 focus:ring-gv-primary-dark" />
          </div>
          <div>
            <label class="text-gv-fg text-xs font-semibold block mb-1">Descanso Corto</label>
            <input data-testid="settings-short-break-input" type="number" step="1" min="1"
              [ngModel]="draft().shortBreak" (ngModelChange)="onNumberChange('shortBreak', $event)"
              class="w-full bg-gv-surface rounded-lg px-3 py-2 text-gv-fg outline-none focus:ring-2 focus:ring-gv-primary-dark" />
          </div>
          <div>
            <label class="text-gv-fg text-xs font-semibold block mb-1">Descanso Largo</label>
            <input data-testid="settings-long-break-input" type="number" step="1" min="1" [ngModel]="draft().longBreak"
              (ngModelChange)="onNumberChange('longBreak', $event)"
              class="w-full bg-gv-surface rounded-lg px-3 py-2 text-gv-fg outline-none focus:ring-2 focus:ring-gv-primary-dark" />
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-gv-fg font-semibold text-sm">Iniciar Descansos Automáticamente</span>
        <button type="button" data-testid="settings-auto-start-breaks-toggle"
          (click)="updateDraft('autoStartBreaks', !draft().autoStartBreaks)" role="switch"
          [attr.aria-checked]="draft().autoStartBreaks"
          class="w-11 h-6 rounded-full transition-colors duration-200 relative shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-gv-primary-dark/60"
          [class.bg-gv-primary-dark]="draft().autoStartBreaks" [class.bg-gv-fg/25]="!draft().autoStartBreaks">
          <span
            class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow-sm transition-transform duration-200"
            [style.transform]="draft().autoStartBreaks ? 'translateX(20px)' : 'translateX(0px)'"></span>
        </button>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-gv-fg font-semibold text-sm">Iniciar Pomodoros Automáticamente</span>
        <button type="button" data-testid="settings-auto-start-pomodoros-toggle"
          (click)="updateDraft('autoStartPomodoros', !draft().autoStartPomodoros)" role="switch"
          [attr.aria-checked]="draft().autoStartPomodoros"
          class="w-11 h-6 rounded-full transition-colors duration-200 relative shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-gv-primary-dark/60"
          [class.bg-gv-primary-dark]="draft().autoStartPomodoros" [class.bg-gv-fg/25]="!draft().autoStartPomodoros">
          <span
            class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow-sm transition-transform duration-200"
            [style.transform]="draft().autoStartPomodoros ? 'translateX(20px)' : 'translateX(0px)'"></span>
        </button>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-gv-fg font-semibold text-sm">Intervalo de Descanso Largo</span>
        <input data-testid="settings-long-break-interval-input" type="number" step="1" min="1"
          [ngModel]="draft().longBreakInterval" (ngModelChange)="onNumberChange('longBreakInterval', $event)"
          class="w-16 bg-gv-surface rounded-lg px-2 py-1.5 text-gv-fg text-center outline-none focus:ring-2 focus:ring-gv-primary-dark" />
      </div>
    </div>

    <div class="flex justify-end gap-2 px-6 py-4 border-t border-gv-fg/10">
      <button data-testid="settings-cancel-btn" (click)="onCancel()"
        class="px-4 py-2 rounded-lg text-gv-fg/70 hover:text-gv-fg font-semibold text-sm transition-colors">
        Cancelar
      </button>
      <button data-testid="settings-save-btn" (click)="onSave()"
        class="px-5 py-2 rounded-lg bg-gv-primary-dark text-gv-bg font-semibold text-sm hover:opacity-90 transition-opacity">
        Guardar
      </button>
    </div>
  </div>
</div>
}
